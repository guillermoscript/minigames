<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Ware · Crew</title>
<style>body{margin:0;background:#141322;color:#fff;font:16px system-ui;padding:24px}h1{margin:0 0 8px}p{color:#c3bedb;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1100px;margin:auto}article{border:2px solid #665b85;border-radius:14px;overflow:hidden;background:#27233b}article h2{font-size:18px;margin:14px 16px}article canvas{width:100%;display:block}#c{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:12px}}</style>
<h1>DUO / CREW · 7 juegos</h1><p>Vista animada del arte y los controles. Esta galería simula acciones locales; las partidas compartidas se juegan desde PARTY.</p><canvas id="c" width="800" height="600"></canvas><section class="grid" id="gallery"></section>
<script src="../js/i18n.js"></script><script src="../js/core.js"></script><script src="../js/games/wave1.js"></script><script src="../js/art/crew-art.js"></script><script src="../js/games/crew.js"></script><script src="../js/i18n/es/party-help.js"></script><script src="../js/i18n/es/ui.js"></script><script src="../js/i18n/es/du1.js"></script>
<script>
muted=true;VW=800;OX=0;cv.width=800;cv.height=600;
const previews=[['swat','Referencia · Stage 1: Bug Hunt'],['type','Referencia · Stage 2: Keyboard Kingdom'],['du_wipers','Ventanas · Lavado de autobús'],['du_spincrew','Ruedas · Taller de rescate'],['du_balancecrew','Equilibrio · Circo de equilibrio'],['du_frogcrew','Nuevo · Banquete de ranas'],['du_dragoncrew','Nuevo · Dragón globo'],['du_bridgecrew','Nuevo · Constructores del puente'],['du_eggcrew','Nuevo · Rescate de huevos']].filter((item,i)=>!new URLSearchParams(location.search).has('new')||i>=5).map(([id,name],i)=>{
 const article=document.createElement('article'), heading=document.createElement('h2'),canvas=document.createElement('canvas');heading.textContent=name;canvas.width=800;canvas.height=600;article.append(heading,canvas);document.getElementById('gallery').append(article);
 const role=i%4;return{id,role,canvas,g:make(id,role)};
});
function make(id,role){if(!id.startsWith('du_'))return withSeed(42,()=>REGMAP[id].fn(1));let receive;const g=withSeed(42,()=>REGMAP[id].fn(1,{role,roles:4,send(){},onMsg(fn){receive=fn;}}));for(let i=0;i<4;i++)if(receive && i!==role)receive('crew_progress',{role:i,p:.35+i*.13});return g;}
function colorsForPreview(role){return ['#4DB8FF','#FF4D9E','#FFE14D','#5CFF7A'][role];}
let frame=0;function paint(){now=frame/60;for(const item of previews){let g=item.g;if(frame%720===0)item.g=g=make(item.id,item.role);
 const c=g.dbg?g.dbg.clock():now;if(item.id==='du_wipers')g.move({x:400+280*Math.sin(c*3),y:330});
 if(item.id==='du_spincrew')g.key({code:'Space'});
 if(item.id==='du_balancecrew')g.move({x:400+180*Math.sin(c*.5),y:330});
 if(item.id==='du_frogcrew'&&Math.abs(Math.sin(c*3))<.3)g.key({code:'Space'});
 if(item.id==='du_bridgecrew'&&Math.abs(Math.sin(c*3.5))<.3)g.down({x:400,y:330});
 if(item.id==='du_dragoncrew'){if(g.dbg.charge()>=.7)g.keyup({code:'Space'});else g.key({code:'Space'});}
 if(item.id==='du_eggcrew')g.move({x:110+580*g.dbg.eggX(),y:330});
 g.update(1/60);
 if(item.id.startsWith('du_') && new URLSearchParams(location.search).has('outcome'))g.result=new URLSearchParams(location.search).get('outcome')==='win'?'win':'lose';
 ctx.setTransform(1,0,0,1,0,0);g.draw(0);
 if(item.id.startsWith('du_') && new URLSearchParams(location.search).has('hud')){
 txt(g.hint,400,36,24,'#fff','center',520);box(10,88,300,34,colorsForPreview(item.role),3);txt(t('YOU: {role}',{role:t(g.roleLabel)}),20,106,20,INK,'left',282);
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,554,800,46);circ(760,577,19,'#2b2b3a',4);
 }
 item.canvas.getContext('2d').drawImage(cv,0,0);
 }frame++;requestAnimationFrame(paint);}paint();
</script></html>
