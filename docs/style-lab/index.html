<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniCaos · laboratorio de estilos</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0f0b1a;color:#fff;font:600 14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
  canvas{width:min(100%,800px);height:auto;aspect-ratio:4/3;background:#000;border-radius:10px;touch-action:none;display:block}
  .bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:#2a2342;color:#fff;cursor:pointer}
  button.on{background:#FFD23F;color:#14101c}
  small{opacity:.7;max-width:760px;text-align:center;line-height:1.4}
</style></head>
<body>
<div class="bar" id="games"></div>
<div class="bar" id="styles"></div><div class="bar" id="styles2"></div>
<canvas id="c" width="800" height="600"></canvas>
<div class="bar"><button id="retry">↻ otra vez</button><button id="spd">vel 1x</button><button id="mic">🎤 mic: off</button><span id="info"></span></div>
<small id="help"></small>
<script src="engine.js"></script>
<script src="lab-ui.js"></script>
</body></html>
