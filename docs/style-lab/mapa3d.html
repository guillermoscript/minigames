<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mapa 3D · prototipo</title>
<style>
html,body{margin:0;height:100%;background:#1459b8;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud{position:fixed;left:12px;bottom:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
button{font:800 15px system-ui;padding:12px 18px;border:3px solid #14101c;border-radius:12px;background:#ffd23f;color:#14101c;cursor:pointer}
button.sec{background:#fff}
button:disabled{opacity:.5}
#info{position:fixed;left:12px;top:12px;background:#14101cdd;color:#fff;border-radius:12px;padding:8px 12px;font:700 13px system-ui;max-width:70vw;pointer-events:none}
#ajustes{position:fixed;right:12px;bottom:72px;background:#14101cee;color:#fff;border-radius:12px;padding:12px;font:700 13px system-ui;display:none;gap:8px;flex-direction:column}
#ajustes.on{display:flex}
#dado{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:900 64px system-ui;color:#fff;text-shadow:0 4px 0 #14101c,0 0 12px #14101c;opacity:0;transition:opacity .2s;pointer-events:none}
.sp{flex:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dado"></div>
<div id="info">Toca la casilla amarilla para elegir camino · Arrastra: girar · Rueda: zoom</div>
<div id="ajustes"><button class="sec" id="pix">▦ Pixeles: ON</button></div>
<div id="hud">
  <button id="tirar">🎲 TIRAR</button>
  <button class="sec" id="vista">🗺 País</button>
  <div class="sp"></div>
  <button class="sec" id="cfg" aria-label="Ajustes">⚙</button>
</div>
<script src="../../js/vendor/three.min.js"></script>
<script src="fiesta-mapa-venezuela.js"></script>
<script src="fiesta-mapa-arte.js"></script>
<script>
(function(){
'use strict';
const MAPA=FIESTA.MAPAS.venezuela,ARTE=FIESTA.arte;
const NOD=MAPA.nodos,ADY=MAPA.ady,IDS=Object.keys(NOD);
const SIL=ARTE.SILUETA,ISLAS=ARTE.ISLAS,LAGO=ARTE.LAGO;

/* ── utilidades ── */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,sstep=(a,b,v)=>{v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v);};
let seed=7;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const rr=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)];
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
const fbm=(x,y)=>vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.15;
const col=h=>new THREE.Color(h);
const segDist=(px,py,ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;const ex=px-ax-dx*t,ey=py-ay-dy*t;return Math.sqrt(ex*ex+ey*ey);};

/* ── casillas: separar los centros ≥ 1,5 diámetros (diámetro = 16) para que ninguna se pise ── */
const TILE_R=8,SEPARA=26;
const POS={};IDS.forEach(i=>{POS[i]={x:NOD[i].x,y:NOD[i].y};});
(function relajar(){
  for(let it=0;it<220;it++){
    for(let a=0;a<IDS.length;a++)for(let b=a+1;b<IDS.length;b++){
      const p=POS[IDS[a]],q=POS[IDS[b]];let dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>=SEPARA)continue;if(d<.01){dx=rnd()-.5;dy=rnd()-.5;d=Math.sqrt(dx*dx+dy*dy);}
      const f=(SEPARA-d)/2/d;p.x-=dx*f;p.y-=dy*f;q.x+=dx*f;q.y+=dy*f;}
    IDS.forEach(i=>{const p=POS[i],o=NOD[i];p.x+=(o.x-p.x)*.012;p.y+=(o.y-p.y)*.012;});   // no se alejan de su sitio original
  }
})();

/* ── caminos: tramos, cruces y puntos de muestreo ── */
const EDGES=[];
(function(){const vistos={};
  Object.keys(ADY).forEach(a=>ADY[a].forEach(b=>{if(!NOD[a]||!NOD[b])return;const k=a<b?a+'|'+b:b+'|'+a;if(vistos[k])return;vistos[k]=1;EDGES.push({a:a,b:b});}));
})();
const GRID={};const gk=(x,y)=>Math.floor(x/16)+','+Math.floor(y/16);
function marca(x,y){const k=gk(x,y);(GRID[k]=GRID[k]||[]).push([x,y]);}
function nearDist(x,y){let m=1e9;const cx=Math.floor(x/16),cy=Math.floor(y/16);
  for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const a=GRID[(cx+i)+','+(cy+j)];if(a)for(let q=0;q<a.length;q++){const dx=a[q][0]-x,dy=a[q][1]-y,d=dx*dx+dy*dy;if(d<m)m=d;}}
  return Math.sqrt(m);}
const libre=(x,y,r)=>nearDist(x,y)>=r;
EDGES.forEach(e=>{const A=POS[e.a],B=POS[e.b];e.L=Math.hypot(B.x-A.x,B.y-A.y);const n=Math.max(2,Math.ceil(e.L/6));for(let s=0;s<=n;s++)marca(lerp(A.x,B.x,s/n),lerp(A.y,B.y,s/n));});
IDS.forEach(i=>marca(POS[i].x,POS[i].y));
// cruces sin conexión: el segundo camino pasa por encima (puente)
(function(){
  const inter=(p,q,r,s)=>{const d=(q.x-p.x)*(s.y-r.y)-(q.y-p.y)*(s.x-r.x);if(Math.abs(d)<1e-6)return null;
    const t=((r.x-p.x)*(s.y-r.y)-(r.y-p.y)*(s.x-r.x))/d,u=((r.x-p.x)*(q.y-p.y)-(r.y-p.y)*(q.x-p.x))/d;return(t>.02&&t<.98&&u>.02&&u<.98)?{t:t,u:u}:null;};
  EDGES.forEach(e=>{e.sobre=[];});
  for(let i=0;i<EDGES.length;i++)for(let j=i+1;j<EDGES.length;j++){const e=EDGES[i],f=EDGES[j];
    if(e.a===f.a||e.a===f.b||e.b===f.a||e.b===f.b)continue;
    const h=inter(POS[e.a],POS[e.b],POS[f.a],POS[f.b]);if(h)f.sobre.push(h.u*f.L);}
})();

/* ── máscara de tierra (diseño -100..1100 → lienzo C×C) ── */
const C=600,K=C/1200,OFF=100;
const CANAL=[[122,150],[178,150],[182,212],[118,212]];
function mascara(){
  const cv=document.createElement('canvas');cv.width=cv.height=C;const g=cv.getContext('2d');
  const P=(x,y)=>[(x+OFF)*K,(y+OFF)*K];
  const poli=(pts,f)=>{g.fillStyle=f;g.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});g.closePath();g.fill();};
  const leer=()=>{const d=g.getImageData(0,0,C,C).data,a=new Float32Array(C*C);for(let i=0;i<C*C;i++)a[i]=d[i*4]/255;return a;};
  g.fillStyle='#000';g.fillRect(0,0,C,C);
  poli(SIL,'#fff');
  g.fillStyle='#fff';ISLAS.forEach(e=>{const q=P(e[0],e[1]);g.beginPath();g.ellipse(q[0],q[1],e[2]*K,e[3]*K,0,0,7);g.fill();});
  poli(LAGO,'#000');poli(CANAL,'#000');                                   // el lago es agua y se abre al golfo
  g.fillStyle='#fff';IDS.forEach(i=>{const q=P(POS[i].x,POS[i].y);g.beginPath();g.arc(q[0],q[1],19*K,0,7);g.fill();});
  const tierra=leer();
  g.fillStyle='#000';g.fillRect(0,0,C,C);poli(LAGO,'#fff');poli(CANAL,'#fff');
  return{tierra:tierra,lago:leer()};
}
function blur(src,r,pasadas){ // caja separable (Safari no trae ctx.filter)
  let a=Float32Array.from(src),b=new Float32Array(C*C);
  for(let p=0;p<pasadas;p++){
    for(let y=0;y<C;y++){let s=0;for(let x=-r;x<=r;x++)s+=a[y*C+clamp(x,0,C-1)];
      for(let x=0;x<C;x++){b[y*C+x]=s/(2*r+1);s+=a[y*C+clamp(x+r+1,0,C-1)]-a[y*C+clamp(x-r,0,C-1)];}}
    for(let x=0;x<C;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[clamp(y,0,C-1)*C+x];
      for(let y=0;y<C;y++){a[y*C+x]=s/(2*r+1);s+=b[clamp(y+r+1,0,C-1)*C+x]-b[clamp(y-r,0,C-1)*C+x];}}
  }
  return a;
}
const M=mascara(),M1=blur(M.tierra,3,2),M2=blur(M.tierra,16,2),M3=blur(M.tierra,7,2),ML=blur(M.lago,3,1),MLW=blur(M.lago,11,2);
function samp(arr,x,y){const fx=clamp((x+OFF)*K,0,C-1.001),fy=clamp((y+OFF)*K,0,C-1.001),ix=fx|0,iy=fy|0,u=fx-ix,v=fy-iy;
  return lerp(lerp(arr[iy*C+ix],arr[iy*C+ix+1],u),lerp(arr[(iy+1)*C+ix],arr[(iy+1)*C+ix+1],u),v);}

/* ── regiones: pesos suaves por cercanía a sus casillas ── */
const REGS=[...new Set(IDS.map(i=>NOD[i].r))];
const NL=IDS.map(i=>({x:POS[i].x,y:POS[i].y,r:NOD[i].r}));
const DELTA=NL.filter(n=>n.r==='del');
const CPESOS={};
function pesos(x,y){const key=Math.round(x/2)*4096+Math.round(y/2),h=CPESOS[key];if(h)return h;
  const d={};REGS.forEach(r=>d[r]=1e9);
  for(let i=0;i<NL.length;i++){const n=NL[i],dx=n.x-x,dy=n.y-y,e=dx*dx+dy*dy;if(e<d[n.r])d[n.r]=e;}
  let s=0;const w={};REGS.forEach(r=>{w[r]=Math.exp(-Math.sqrt(d[r])/26);s+=w[r];});REGS.forEach(r=>{w[r]/=s;});return CPESOS[key]=w;}
function pesoDelta(x,y){let m=1e9;for(let i=0;i<DELTA.length;i++){const dx=DELTA[i].x-x,dy=DELTA[i].y-y,e=dx*dx+dy*dy;if(e<m)m=e;}return 1-sstep(22,62,Math.sqrt(m));}

/* ── ríos: curvas suaves (Catmull-Rom) ── */
function spline(pts,paso){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];
  const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/paso));
  for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;out.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
  out.push(pts[pts.length-1]);return out;}
const RIOS=[
  [[470,610],[440,540],[470,480],[540,445],[620,420],[690,355],[780,305],[850,300]],        // Orinoco
  [[735,630],[725,560],[705,490],[700,430]],                                               // Caroní
  [[215,420],[290,455],[370,470],[450,490]],                                               // Apure
  [[225,360],[290,395],[340,430],[420,470]]].map(r=>spline(r,6));                          // Andes → llanos
function distRio(x,y){let m=1e9;for(let r=0;r<RIOS.length;r++){const p=RIOS[r];for(let i=0;i<p.length-1;i++){
  if(Math.abs(p[i][0]-x)>40||Math.abs(p[i][1]-y)>40)continue;const d=segDist(x,y,p[i][0],p[i][1],p[i+1][0],p[i+1][1]);if(d<m)m=d;}}return m;}

/* ── relieve ── */
const TOPE=10,SEA=1.5;
const MESAS=[[775,612,46,36],[860,690,34,30],[722,702,30,26],[905,605,26,24]];       // tepuyes [x,y,radio,alto]
const ISLOTES=[[690,152,12,22],[722,146,10,25],[646,140,9,16],[852,142,10,18]];     // Mochima
const PICOS=[[150,445,26,40],[185,420,28,44],[220,398,30,48],[258,372,28,42],[296,350,24,36],[205,452,22,30],[250,418,22,32],[170,392,20,28]]; // cadena andina
const DUNAS=[[250,128,34,12],[282,142,30,10],[305,118,26,9]];                        // [x,y,largo,alto]
function relieve(x,y){
  let h=fbm(x*.02,y*.02)*2.4,g=0;
  for(let i=0;i<PICOS.length;i++){const p=PICOS[i],d=Math.sqrt((x-p[0])**2+(y-p[1])**2);if(d<p[2]){const k=1-d/p[2];g+=p[3]*Math.pow(k,1.35)*(.85+fbm(x*.06,y*.06)*.3);}}
  g+=5*Math.exp(-((x-215)**2+(y-410)**2)/(2*90*90));                                  // base ancha de la sierra
  g+=24*Math.exp(-((y-158)**2)/(2*15*15))*sstep(400,470,x)*(1-sstep(600,660,x))*(.75+fbm(x*.05,y*.05)*.5);   // El Ávila, detrás de la ciudad
  MESAS.forEach(m=>{const d=Math.sqrt((x-m[0])**2+(y-m[1])**2);g+=m[3]*(1-sstep(m[2]-4,m[2]+4,d))*(1+fbm(x*.08,y*.08)*.08);});
  DUNAS.forEach(d=>{const u=(x-d[0])/d[2],v=(y-d[1])/(d[2]*.5);g+=d[3]*Math.exp(-(u*u+v*v)*1.6);});
  const apl=1-.55*(1-sstep(10,34,nearDist(x,y)));                                      // suaviza donde pasan caminos
  return h+g*apl;
}
function altura(x,y){
  const wl=sstep(.03,.32,samp(MLW,x,y)),mm=lerp(samp(M1,x,y),samp(M3,x,y),wl);
  const t=wl>0?sstep(.22,.78,mm):sstep(.3,.7,mm);
  let mar=-6-(1-samp(M2,x,y))*9;mar=lerp(mar,-3.2,wl);
  const wd=pesoDelta(x,y);
  let tierra=lerp(TOPE+relieve(x,y),SEA+1.3,wd);
  tierra-=2.6*(1-sstep(2.6,7.5,distRio(x,y)))*(1-wd);                                   // cauce
  let h=lerp(mar,tierra,t);
  for(let i=0;i<ISLOTES.length;i++){const s=ISLOTES[i],p=1-sstep(s[2]-3,s[2]+4,Math.sqrt((x-s[0])**2+(y-s[1])**2));if(p>0)h=Math.max(h,lerp(mar,s[3]+fbm(x*.1,y*.1)*3,p));}
  return h;
}

/* ── escena ── */
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
let PIX=2;function tam(){R.setPixelRatio(1/PIX);R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
const S=new THREE.Scene();S.background=col('#1459b8');
const cam=new THREE.PerspectiveCamera(24,1,40,7000);
S.add(new THREE.HemisphereLight(0xe2ecfa,0x6a7f96,.78));
const sol=new THREE.DirectionalLight(0xffffff,.48);sol.position.set(-300,600,300);S.add(sol);
const TEXTOS=[];

/* terreno */
(function(){
  const N=260,W=1200,pos=new Float32Array((N+1)*(N+1)*3),colr=new Float32Array((N+1)*(N+1)*3),idx=[];
  const hs=new Float32Array((N+1)*(N+1));
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
    const X=-W/2+i*W/N,Z=-W/2+j*W/N,h=altura(X+500,Z+500),k=j*(N+1)+i;hs[k]=h;pos[k*3]=X;pos[k*3+1]=h;pos[k*3+2]=Z;
  }
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();const nor=g.attributes.normal.array;
  const PAL={ccs:'#7d9f50',coc:'#8fae52',zul:'#d9b878',and:'#6f8a52',lla:'#a8b65a',gua:'#2c6f32',can:'#1f5f2a',del:'#7d62b8',moc:'#7fa860',mar:'#8fae52',roq:'#dcc98c'};
  const PC={};Object.keys(PAL).forEach(r=>PC[r]=col(PAL[r]));
  const tmp=new THREE.Color(),c2=new THREE.Color();
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
    const k=j*(N+1)+i,h=hs[k],x=pos[k*3]+500,y=pos[k*3+2]+500,ny=nor[k*3+1];
    if(h<SEA-.5){ // fondo marino: turquesa en la orilla, azul hondo mar adentro, más oscuro en el lago
      const sh=sstep(.04,.55,samp(M3,x,y));tmp.set('#0e4aa8').lerp(c2.set('#46d4e6'),sh);
      tmp.lerp(c2.set('#1a5cc8'),samp(ML,x,y)*.7*(1-sh*.3));
      let lk=1;ISLOTES.forEach(s=>{if(Math.hypot(x-s[0],y-s[1])<s[2]+6)lk=0;});
      if(!lk)tmp.lerp(c2.set('#7a5a3a'),.7);
    }else{
      const w=pesos(x,y);tmp.setRGB(0,0,0);REGS.forEach(r=>{const p=PC[r]||PC.coc;tmp.r+=p.r*w[r];tmp.g+=p.g*w[r];tmp.b+=p.b*w[r];});
      const wd=pesoDelta(x,y);
      tmp.multiplyScalar(.88+fbm(x*.045,y*.045)*.24);
      if(w.lla>.3)tmp.lerp(c2.set('#93a64e'),fbm(x*.07,y*.07)*.45*w.lla);                   // manchas de pasto en los llanos
      // Andes: pasto y bosque abajo, roca arriba, nieve solo en las cumbres
      if(w.and>.15||h>TOPE+14){tmp.lerp(c2.set('#8b8676'),sstep(TOPE+14,TOPE+30,h)*.9);tmp.lerp(c2.set('#e9eef8'),sstep(TOPE+36,TOPE+43,h));}
      // Falcón: arena cálida y dunas
      let du=0;DUNAS.forEach(d=>{du=Math.max(du,Math.exp(-(((x-d[0])/d[2])**2+((y-d[1])/(d[2]*.5))**2)*1.2));});
      const falc=Math.hypot(x-270,y-135);tmp.lerp(c2.set('#e2b868'),clamp(du*.95+(1-sstep(50,95,falc))*.6,0,1));
      // El Ávila, verde oscuro
      if(Math.abs(y-158)<26&&x>390&&x<650)tmp.lerp(c2.set('#2f7a3a'),.6*(1-Math.abs(y-158)/26));
      // orilla de arena (también la ribera del lago)
      if(h<SEA+2.4&&wd<.5)tmp.lerp(c2.set('#e8d396'),.85*(1-wd*2)*(1-sstep(SEA+.6,SEA+2.4,h)*.4));
      // delta violeta apagado con manchas verdes
      if(wd>.05){tmp.lerp(c2.set('#7d62b8'),wd*.85);tmp.lerp(c2.set('#3a8a4a'),wd*sstep(.55,.75,fbm(x*.12,y*.12))*.8);}
      // islotes de Mochima: copa verde, flancos de roca
      for(let s=0;s<ISLOTES.length;s++){const e=ISLOTES[s],d=Math.hypot(x-e[0],y-e[1]);if(d<e[2]+5&&h>TOPE-3&&ny>.78)tmp.set('#2d8a2a').lerp(c2.set('#4aa83a'),fbm(x*.2,y*.2));}
      // acantilados suaves
      if(ny<.62)tmp.lerp(c2.set(h>TOPE+12&&w.and<.3?'#a9683a':'#a07045'),clamp((.62-ny)*2.2,0,.75));
      if(h<SEA+.7)tmp.lerp(c2.set('#d8f0f0'),.65);                                             // espuma
    }
    const ruido=.96+hash(i,j)*.08;
    colr[k*3]=tmp.r*ruido;colr[k*3+1]=tmp.g*ruido;colr[k*3+2]=tmp.b*ruido;
  }
  g.setAttribute('color',new THREE.BufferAttribute(colr,3));
  S.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
  const mar=new THREE.Mesh(new THREE.PlaneGeometry(7000,7000).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x2fb4e0,transparent:true,opacity:.55}));
  mar.position.y=SEA;S.add(mar);
  const abismo=new THREE.Mesh(new THREE.PlaneGeometry(7000,7000).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x0e4aa8}));
  abismo.position.y=-16;S.add(abismo);
})();

/* ── cintas (caminos y ríos): una malla continua por familia, sin rayas ni escalones ── */
function cintaMalla(listas){ // listas: [{P:[{x,y,z}],hw,dy,col:(i)=>Color}]
  const pos=[],colr=[],nor=[],idx=[];
  listas.forEach(L=>{const P=L.P,n=P.length,base=pos.length/3;
    for(let i=0;i<n;i++){const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,n-1)];let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
      const nx=-tz,nz=tx,c=L.col(i);
      pos.push(P[i].x+nx*L.hw,P[i].y+L.dy,P[i].z+nz*L.hw,P[i].x-nx*L.hw,P[i].y+L.dy,P[i].z-nz*L.hw);
      colr.push(c.r,c.g,c.b,c.r,c.g,c.b);nor.push(0,1,0,0,1,0);}
    for(let i=0;i<n-1;i++){const a=base+i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colr),3));g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));g.setIndex(idx);
  return new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));
}

addEventListener('resize',tam);tam();

/* ── etiquetas por vista: regiones y hitos en el país; el nombre del sitio en la vista de jugador ── */
const REG_TXT={ccs:'CARACAS',coc:'CENTRO-OCCIDENTE',zul:'ZULIA',and:'LOS ANDES',lla:'LOS LLANOS',gua:'GUAYANA',can:'CANAIMA',del:'DELTA',moc:'MOCHIMA',mar:'MARGARITA',roq:'LOS ROQUES'};
const HITOS=[['Puente sobre el Lago',150,205],['Salto Ángel',775,655],['Teleférico de Mérida',215,395],['El Ávila',470,150]];
const ETQ_REG=(MAPA.regiones||[]).filter(r=>REG_TXT[r.id]).map(r=>{const p=W3(r.centro[0],r.centro[1]);return{s:etiqueta(REG_TXT[r.id],true),p:new THREE.Vector3(p.x,p.y+34,p.z)};});
const ETQ_HITO=HITOS.map(h=>{const p=W3(h[1],h[2]);return{s:etiqueta(h[0]),p:new THREE.Vector3(p.x,p.y+40,p.z)};});
let ETQ_ACT=null;
function etiquetas(){
  const v=C3.vista;
  ETQ_REG.forEach(e=>{if(v)fijar(e.s,e.p,1.3);else e.s.visible=false;});
  ETQ_HITO.forEach(e=>{if(v)fijar(e.s,e.p,.85);else e.s.visible=false;});
  let e=null;
  if(!v&&!opciones){const j=J[activo];e=etiqueta(NOD[j.nodo].n);fijar(e,j.s.position.clone().add(new THREE.Vector3(0,j.s.scale.y+14,0)),.9);}
  if(ETQ_ACT&&ETQ_ACT!==e)ETQ_ACT.visible=false;
  ETQ_ACT=e;
  TEXTOS.forEach(s=>{if(!s.visible)return;const k=cam.position.distanceTo(s.position)*.016*(s.userData.k||1);s.scale.set(k*5.33,k,1);});
}

/* arranque: la cámara empieza ya mirando a la ficha */
C3.obj.copy(J[0].s.position);C3.pos.copy(C3.obj).add(new THREE.Vector3(0,Math.sin(C3.pitch)*C3.dist,Math.cos(C3.pitch)*C3.dist));
J[0].an.visible=true;ponPistas(SALIDAS[J[0].nodo]);
let ult=performance.now();
(function bucle(){const n=performance.now(),dt=Math.min(.05,(n-ult)/1000),s=n/1000;ult=n;
  J.forEach((j,i)=>{const act=i===activo,k=act?1.1:.9;j.s.scale.set(FICHAS[i].w*k,FICHAS[i].h*k,1);
    if(j.an.visible){const p=1+Math.sin(s*5)*.08;j.an.scale.set(p,1,p);}
    if(!(ocupado&&act))j.s.position.y=j.base.position.y+.9+Math.sin(s*3+i)*.2;
    j.fl.visible=act;if(act){j.fl.position.set(j.s.position.x,j.s.position.y+j.s.scale.y+7+Math.sin(s*4)*1.8,j.s.position.z);}});
  PISTAS.forEach(m=>{if(m.visible){const p=1+Math.sin(s*7)*.12;m.scale.set(p,1,p);}});
  CAB.forEach(c=>{c.t=(c.t+dt*.07)%2;const u=c.t<1?c.t:2-c.t;c.m.position.set(lerp(c.a.x,c.b.x,u),lerp(c.a.y,c.b.y,u)-3,lerp(c.a.z,c.b.z,u));});
  pasaCam(dt);etiquetas();R.render(S,cam);requestAnimationFrame(bucle);})();
window.__mapa3d={S:S,cam:cam,C3:C3,J:J,POS:POS};
})();
</script>
</body>
