<!doctype html>

<head>

<body>
<canvas id="c" width="800" height="600"></canvas>
<div class="row">
  <button id="again">▶ Otra vez</button>

<small>Todo dibujado con código (sin imágenes). Toca, haz clic, ESPACIO o grita ¡PARADA!.</small>

<script>
const cv=document.getElementById('c'),main=cv.getContext('2d');
let X=main;                       // every helper draws on X so scenes can be baked offscreen
const INK='#14101c';
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- path + cel-shading helpers ---------- */
const E=(x,y,rx,ry,rot=0)=>()=>X.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
const R=(x,y,w,h,r=0)=>()=>X.roundRect(x,y,w,h,r);
const P=(pts)=>()=>{X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);X.closePath();};
function cel(p,base,shade,lw=3.5,dx=-4,dy=-5){
  X.beginPath();p();X.lineJoin=X.lineCap='round';X.lineWidth=lw*2;X.strokeStyle=INK;X.stroke();
  X.fillStyle=shade||base;X.fill();
  if(shade){X.save();X.beginPath();p();X.clip();X.translate(dx,dy);X.beginPath();p();X.fillStyle=base;X.fill();X.restore();}
}
function flat(p,col,lw=0){X.beginPath();p();if(lw){X.lineJoin='round';X.lineWidth=lw*2;X.strokeStyle=INK;X.stroke();}X.fillStyle=col;X.fill();}
function ln(pts,w,col,ink=true,closed=false){
  X.lineCap=X.lineJoin='round';X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);if(closed)X.closePath();
  if(ink){X.lineWidth=w+6;X.strokeStyle=INK;X.stroke();}
  X.lineWidth=w;X.strokeStyle=col;X.stroke();
}
function limb(x1,y1,x2,y2,w,col,shade){ // thick rounded limb with ink
  X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineWidth=w+7;X.strokeStyle=INK;X.stroke();
  X.lineWidth=w;X.strokeStyle=shade||col;X.stroke();
  if(shade){X.save();X.translate(-w*.14,-w*.14);X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineWidth=w*.62;X.strokeStyle=col;X.stroke();X.restore();}
}
function glint(x,y,rx,ry,rot=-.5,a=.45){X.save();X.globalAlpha=a;X.fillStyle='#fff';X.beginPath();X.ellipse(x,y,rx,ry,rot,0,7);X.fill();X.restore();}
function text(s,x,y,size,fill='#fff',lw=.2){X.font=`900 ${size}px system-ui,sans-serif`;X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';X.lineWidth=size*lw;X.strokeStyle=INK;X.strokeText(s,x,y);X.fillStyle=fill;X.fillText(s,x,y);}
function seeded(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
/* ---------- faces ---------- */
function face(cx,cy,k,mood,o={}){
  const eyeY=cy-3*k,ex=11.5*k;
  if(o.cheeks!==false){X.save();X.globalAlpha=.4;X.fillStyle='#ff5c7a';for(const sg of[-1,1]){X.beginPath();X.ellipse(cx+sg*20*k,cy+9*k,6.5*k,4.2*k,0,0,7);X.fill();}X.restore();}
  if(!o.glasses){
    for(const sg of[-1,1]){
      const x=cx+sg*ex;
      if(mood==='happy'){ln([[x-7*k,eyeY+2*k],[x,eyeY-7*k],[x+7*k,eyeY+2*k]],3.2,INK,false);}
      else if(mood==='sleep'){ln([[x-7*k,eyeY-1*k],[x,eyeY+6*k],[x+7*k,eyeY-1*k]],3.2,INK,false);}
      else{
        const ry=(mood==='shout'?10:9)*k;
        flat(E(x,eyeY,7.6*k,ry),'#fff',2.4);
        const lk=(o.look||0)*2.4*k,up=mood==='worry'?-2.5*k:1.2*k;
        flat(E(x+lk,eyeY+up,3.8*k,4.2*k),INK);flat(E(x+lk+1.3*k,eyeY+up-1.5*k,1.4*k,1.4*k),'#fff');
      }
    }
    // brows
    const by=eyeY-15*k;let tl=0;if(mood==='shout')tl=5*k;else if(mood==='worry')tl=-5*k;
    if(!o.noBrows&&mood!=='sleep'&&mood!=='happy'){
      ln([[cx-ex-8*k,by-tl*.2+(tl>0?-1:3)*k],[cx-ex+7*k,by+tl*.6]],3.8*k,o.brow||INK,false);
      ln([[cx+ex+8*k,by-tl*.2+(tl>0?-1:3)*k],[cx+ex-7*k,by+tl*.6]],3.8*k,o.brow||INK,false);
    }
  } else if(o.glasses==='dark'){
    flat(R(cx-ex-10*k,eyeY-8*k,20*k,15*k,5*k),'#0d0b14',2.6);flat(R(cx+ex-10*k,eyeY-8*k,20*k,15*k,5*k),'#0d0b14',2.6);
    ln([[cx-ex+10*k,eyeY-3*k],[cx+ex-10*k,eyeY-3*k]],3.4*k,INK,false);glint(cx-ex-3*k,eyeY-4*k,3*k,1.4*k,-.5,.6);glint(cx+ex-3*k,eyeY-4*k,3*k,1.4*k,-.5,.6);
  } else if(o.glasses==='round'){
    for(const sg of[-1,1]){const x=cx+sg*ex;flat(E(x,eyeY,10*k,10*k),'rgba(210,235,255,.5)',2.4);
      if(mood!=='sleep'&&mood!=='happy'){flat(E(x,eyeY,3.4*k,3.8*k),INK);} else ln([[x-6*k,eyeY],[x,eyeY+4*k],[x+6*k,eyeY]],2.6,INK,false);}
    ln([[cx-ex+10*k,eyeY],[cx+ex-10*k,eyeY]],2.6,INK,false);
  }
  // nose
  X.lineCap='round';ln([[cx-1*k,cy+4*k],[cx+2.5*k,cy+8*k]],2.6,'rgba(20,16,28,.55)',false);
  // mouth
  const my=cy+17*k;
  if(mood==='shout'){flat(E(cx,my+2*k,9.5*k,11.5*k),'#5a0f1e',2.6);flat(E(cx,my+8*k,6.5*k,4.5*k),'#ff7b8e');}
  else if(mood==='happy'){X.beginPath();X.moveTo(cx-13*k,my-4*k);X.quadraticCurveTo(cx,my+16*k,cx+13*k,my-4*k);X.closePath();X.fillStyle='#5a0f1e';X.fill();X.lineWidth=2.6;X.strokeStyle=INK;X.stroke();
    X.beginPath();X.moveTo(cx-10*k,my-3*k);X.quadraticCurveTo(cx,my+2*k,cx+10*k,my-3*k);X.lineTo(cx+9*k,my);X.quadraticCurveTo(cx,my+5*k,cx-9*k,my);X.fillStyle='#fff';X.fill();}
  else if(mood==='worry'){ln([[cx-10*k,my+3*k],[cx-5*k,my-1*k],[cx,my+3*k],[cx+5*k,my+7*k],[cx+10*k,my+3*k]],3,INK,false);
    flat(E(cx+30*k,cy-18*k,3.4*k,5*k),'#9fe3ff',2);}
  else if(mood==='sleep'){flat(E(cx,my+1*k,4.4*k,5.2*k),'#5a0f1e',2.2);}
  else{ln([[cx-9*k,my],[cx,my+5*k],[cx+9*k,my]],3,INK,false);}
}
/* ---------- characters (origin = feet, ~150 units tall at s=1) ---------- */
function abuela(x,y,s,mood,t=0){
  X.save();X.translate(x,y);X.scale(s,s);X.rotate(Math.sin(t*4)*.015);
  // shoes + legs
  limb(-9,-30,-9,-6,10,'#e8a771','#c98550');limb(9,-30,9,-6,10,'#e8a771','#c98550');
  cel(E(-11,-3,12,6.5),'#7b4a30','#55301c');cel(E(11,-3,12,6.5),'#7b4a30','#55301c');
  // cane
  ln([[40,-4],[40,-70],[46,-78],[54,-72]],6,'#8a5a34');
  // dress
  cel(P([[-26,-92],[26,-92],[34,-30],[-34,-30]]),'#a35bc2','#7d3d9a',4);
  for(const [fx,fy] of [[-14,-78],[10,-70],[-6,-52],[18,-48],[-20,-40],[2,-36]]){flat(E(fx,fy,4.2,4.2),'#ff9ac2',0);flat(E(fx,fy,1.8,1.8),'#ffd23f',0);}
  // arms
  limb(-24,-88,-36,-58,11,'#e8a771','#c98550');limb(24,-88,38,-62,11,'#e8a771','#c98550');
  flat(E(38,-62,6,6),'#e8a771',2.6);
  // bag, striped
  cel(R(-60,-62,32,40,5),'#f2f2f8','#c9cde0',3.5);
  for(let i=0;i<4;i++)flat(R(-60+i*8+1,-62,4,40,0),i%2?'#ff7ab0':'#4a9be8');
  X.beginPath();R(-60,-62,32,40,5)();X.lineWidth=3.5;X.strokeStyle=INK;X.stroke();
  ln([[-54,-62],[-50,-76],[-38,-76],[-34,-62]],3,INK,false);
  // head
  flat(R(-5,-98,10,10,3),'#e8a771',2.6);
  cel(E(0,-118,27,28),'#f0b27e','#d58f5a',4);
  // hair: grey cap + bun
  cel(E(0,-150,12,11),'#cfcfd8','#a2a2b0',3.5);
  X.save();X.beginPath();E(0,-118,27,28)();X.clip();flat(E(0,-134,30,17),'#cfcfd8');flat(E(-4,-136,22,12),'#e6e6ee');X.restore();
  X.beginPath();E(0,-118,27,28)();X.lineWidth=4;X.strokeStyle=INK;X.stroke();
  face(0,-115,.86,mood,{glasses:'round'});
  X.restore();
}
function colector(x,y,s,mood,t=0,dance=1){
  const d=Math.sin(t*9)*dance;
  X.save();X.translate(x,y);X.scale(s,s);X.rotate(d*.05);
  // legs, sneakers
  limb(-11,-62,-12,-18,17,'#2a3a78','#1c2858');limb(11,-62,12,-18,17,'#2a3a78','#1c2858');
  limb(-12,-20,-12,-6,12,'#e8b48a');limb(12,-20,12,-6,12,'#e8b48a');
  cel(E(-13,-3,15,7),'#fff','#cfd3e0');cel(E(13,-3,15,7),'#fff','#cfd3e0');
  // shorts
  cel(P([[-24,-86],[24,-86],[27,-52],[2,-52],[0,-60],[-2,-52],[-27,-52]]),'#2a3a78','#1c2858',4);
  // arms up (dance): left holds hand up, right holds cash
  const la=-1.15+d*.35,ra=-1.15-d*.35;
  const L=[-24-Math.cos(la)*-1,0];
  limb(-24,-110,-24-34,-110-44+d*6,12,'#e8b48a','#c98d5f');limb(24,-110,24+34,-110-44-d*6,12,'#e8b48a','#c98d5f');
  flat(E(-58,-154+d*6,7,7),'#e8b48a',2.6);flat(E(58,-154-d*6,7,7),'#e8b48a',2.6);
  // cash
  cel(R(52,-176-d*6,16,20,2),'#6ccf6a','#3fa044',2.6);
  // jersey
  cel(R(-26,-124,52,46,12),'#2f7fe0','#1f5ab0',4);
  text('23',0,-100,20,'#fff',.2);
  // head
  flat(R(-5,-134,10,10,3),'#e8b48a',2.6);
  cel(E(0,-152,26,27),'#f0c096','#d79f72',4);
  // chain
  ln([[-15,-128],[0,-118],[15,-128]],5,'#ffd23f');
  flat(E(0,-117,5,5),'#ffd23f',2);
  // cap backwards: dome + brim at back (left)
  X.save();X.beginPath();E(0,-152,26,27)();X.clip();flat(E(0,-170,30,18),'#e8242f');X.restore();
  cel(P([[22,-166],[44,-160],[40,-152],[18,-156]]),'#e8242f','#a81820',3);
  glint(-8,-172,9,3.5,-.2,.5);
  face(0,-148,.88,mood,{});
  X.restore();
}
function chofer(x,y,s,mood,t=0){
  X.save();X.translate(x,y);X.scale(s,s);X.rotate(Math.sin(t*5)*.015);
  limb(-14,-58,-14,-10,20,'#2f5fb0','#244a8c');limb(14,-58,14,-10,20,'#2f5fb0','#244a8c');
  cel(E(-17,-4,17,8),'#2b2b3a','#14101c');cel(E(17,-4,17,8),'#2b2b3a','#14101c');
  // belly + tank
  cel(R(-34,-124,68,72,26),'#f6f6f8','#cfd1de',4);
  // arms (holding the wheel)
  limb(-30,-112,-36,-86,18,'#d9a07a','#b87f58');limb(30,-112,36,-86,18,'#d9a07a','#b87f58');
  flat(E(-36,-84,9,9),'#d9a07a',2.6);flat(E(36,-84,9,9),'#d9a07a',2.6);
  // neck + head
  flat(R(-8,-136,16,14,4),'#d9a07a',2.6);
  cel(E(0,-154,28,28),'#e0a981','#bf8760',4);
  // stubble
  X.save();X.beginPath();E(0,-154,28,28)();X.clip();X.fillStyle='rgba(20,16,28,.28)';X.beginPath();X.ellipse(0,-136,26,14,0,0,7);X.fill();X.restore();
  // trucker cap
  X.save();X.beginPath();E(0,-154,28,28)();X.clip();flat(E(0,-174,32,17),'#3fa04a');X.restore();
  cel(P([[-30,-166],[30,-166],[40,-160],[-40,-160]]),'#2e7d38','#1f5a28',3);
  flat(E(0,-172,7,5),'#fff',2);
  face(0,-150,.9,mood,{glasses:'dark',cheeks:false});
  // chain
  ln([[-16,-130],[0,-122],[16,-130]],5,'#ffd23f');
  X.restore();
}
function senora(x,y,s,t=0){ // seated, asleep
  X.save();X.translate(x,y);X.scale(s,s);X.rotate(Math.sin(t*1.6)*.035+.06);
  // skirt on the seat + legs/sandals
  cel(P([[-34,-52],[34,-52],[46,-18],[-46,-18]]),'#a8286a','#7e1a4e',4);
  limb(-14,-18,-14,-2,10,'#c98a5a');limb(16,-18,16,-2,10,'#c98a5a');
  cel(E(-16,2,13,6),'#7b4a30','#55301c');cel(E(18,2,13,6),'#7b4a30','#55301c');
  // cardigan
  cel(R(-30,-100,60,56,16),'#3d7a6a','#2a5a4e',4);
  cel(R(-8,-96,16,44,4),'#2f9ac0','#217aa0',3);
  // bag
  cel(R(-48,-52,34,24,6),'#8b5a34','#62391c',3.5);
  ln([[-44,-52],[-36,-64],[-22,-52]],3,INK,false);
  // head tilted, scarf
  cel(E(2,-124,26,27),'#d9a07a','#b87f58',4);
  X.save();X.beginPath();E(2,-124,26,27)();X.clip();flat(E(2,-136,30,19),'#a45bd0');X.restore();
  cel(P([[18,-140],[40,-146],[36,-130],[24,-126]]),'#a45bd0','#7a3aa0',3);
  face(2,-120,.84,'sleep',{});
  X.restore();
}
function tu(x,y,s,t=0,lean=0){ // the player, from behind
  X.save();X.translate(x,y);X.scale(s,s);X.rotate(Math.sin(t*5)*.012+lean);

  for(const [hx,hy] of [[-14,-166],[-4,-172],[8,-170],[16,-162]])flat(P([[hx-5,hy+8],[hx,hy-4],[hx+6,hy+8]]),'#1b1530',2.4);

}
function dog(x,y,s,pose,t=0){
  X.save();X.translate(x,y);X.scale(s,s);

/* ---------- the bus (baked once; windows are real holes) ---------- */
function bakeBus(){
  const c=document.createElement('canvas');c.width=800;c.height=600;X=c.getContext('2d');
  // ceiling
  let g=X.createLinearGradient(0,0,0,120);g.addColorStop(0,'#b8a88f');g.addColorStop(1,'#9d8e78');X.fillStyle=g;X.fillRect(0,0,800,125);
  X.strokeStyle='rgba(20,16,28,.28)';X.lineWidth=2;for(const [a,b] of [[240,0],[600,0]]){X.beginPath();X.moveTo(a,0);X.quadraticCurveTo(a-18,60,a-4,118);X.stroke();}
  // wall band under the ceiling
  X.fillStyle='#202c4e';X.fillRect(0,112,800,360);
  X.fillStyle='#2b3a63';X.fillRect(0,285,800,105);
  X.fillStyle='#5b6578';X.fillRect(0,390,800,84);
  X.fillStyle='rgba(20,16,28,.25)';X.fillRect(0,388,800,5);
  // window pockets (trim)
  const wins=[[-10,118,288,166],[484,118,168,166],[662,118,160,128]];
  for(const [x,y,w,h] of wins)cel(R(x,y,w,h,16),'#2a3a63','#1c2848',4,0,0);
  // door pocket
  cel(R(292,126,172,350,8),'#2a3a63','#1c2848',4,0,0);
  // seats left
  for(const sx of [-6,64,134]){cel(R(sx,296,66,140,18),'#2d5fb8','#1f4590',4);glint(sx+16,330,6,20,.15,.4);}
  cel(R(-16,412,246,44,16),'#2a58ac','#1d4182',4);
  X.save();X.strokeStyle=INK;X.lineWidth=3;X.beginPath();X.moveTo(150,436);X.lineTo(176,428);X.lineTo(166,442);X.lineTo(188,436);X.stroke();X.restore(); // cracked
  for(const lx of [16,128,206])limb(lx,454,lx,520,9,'#6a7385','#4c5466');
  ln([[44,296],[44,200]],0.1,'#000',false);
  // yellow rails (left seats)
