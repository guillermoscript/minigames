<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa · Roba cartas</title>
<style>
:root{color-scheme:dark}body{margin:0;padding:32px 20px;background:#0b1520;color:#f3f1e9;font:15px "Helvetica Neue",Arial,sans-serif}main{max-width:800px;margin:auto}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 8px}p{color:#94aaa9;font-size:14px;line-height:1.5;margin:0 0 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}button{padding:11px 16px;border:1px solid #304752;border-radius:24px;font:500 13px "Helvetica Neue",Arial,sans-serif;background:#162b36;color:#bbceca;cursor:pointer;transition:background .15s}button:hover{background:#2c4549}button[aria-pressed=true]{background:#e9c989;color:#182b32;border-color:#e9c989}#c{display:block;width:100%!important;height:auto!important;border-radius:20px;box-shadow:0 20px 70px #0005;border:1px solid #29424a;box-sizing:border-box}@media(max-width:600px){body{padding:18px 10px}nav{gap:6px}button{padding:10px 12px}}</style>
<main><h1>Roba cartas</h1><p>Vista previa local con jugadores simulados. Prueba sacar una carta o robar a un rival.</p><nav><button onclick="scene('draw')">Sacar carta</button><button onclick="scene('actor')">Mi reto</button><button onclick="scene('steal')">Robar a un rival</button><button onclick="scene('empty')">Sin cartas para robar</button></nav><canvas id="c" width="800" height="600"></canvas></main>
<script src="../js/i18n.js"></script><script src="../js/i18n/es/ui.js"></script><script src="../js/i18n/es/party-help.js"></script><script src="../js/core.js"></script><script>let btns=[],pressing=false;const party={you:{id:'a'},room:null};const modeLabel=()=>t('CARD HEIST');let previewReceiver;const duoCtx=()=>({send(){},onMsg(fn){previewReceiver=fn;}});const me=()=>party.room.players.find(p=>p.id===party.you.id);function button(x,y,w,h,label,fn,o={}){box(x,y,w,h,o.fill||'#7362CB',3);txt(label,x+w/2,y+h/2,o.size||20,INK,'center',w-12);btns.push({x,y,w,h,fn});}</script><script src="../js/party-modes.js"></script>
<script>
I18N.setLang('es');muted=true;VW=800;OX=0;cv.width=800;cv.height=600;let game;
function scene(kind){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.getAttribute('onclick')===`scene('${kind}')`)));previewReceiver=null;party.stealBusy=null;party.you.id=kind==='actor'?'b':'a';party.room={id:'preview',mode:'cards',round:0,state:'round',players:[{id:'a',name:'Guille',color:'#B49CFF',score:2},{id:'b',name:'Luna',color:'#F28CB1',score:5},{id:'c',name:'Nico',color:'#7BD88F',score:3},{id:'d',name:'Sol',color:'#6EA8FE',score:0}],extra:{actor:kind==='draw'?'a':'b',phase:kind==='draw'?'draw':'challenge',pile:['one','two','three'],remaining:['two','three'],pot:2,deck:14,stolen:{},stealing:{}}};if(kind==='empty')party.room.players.forEach(p=>p.score=0);game=kind==='draw'?partyDrawGame(party.room):partyWrapGame({dur:5,cmd:'JUMP!',hint:'SPACE / TAP',draw:demoDraw,update(){}},party.room,1);}
partyMoveAction=async(action,data)=>{if(action==='draw'){party.room.extra.pile.push('new');party.room.extra.deck--;party.room.extra.card='new';}else{party.room.extra.stealing.a={target:data.target,round:0,readyAt:Date.now()+1200};await new Promise(r=>setTimeout(r,1200));party.room.players.find(p=>p.id===data.target).score--;party.room.players[0].score++;party.room.extra.stolen.a=0;delete party.room.extra.stealing.a;}};
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse={x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*600/r.height};});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*600/r.height;const hit=btns.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(hit)hit.fn();});addEventListener('keydown',e=>{if(game.key)game.key(e);});
function demoDraw(){ctx.fillStyle='#8BBCC1';ctx.fillRect(0,0,800,600);ctx.fillStyle='#A5CBC5';ctx.beginPath();ctx.arc(120,540,270,Math.PI,0);ctx.arc(650,540,330,Math.PI,0);ctx.fill();partyCardPanel(65,470,670,150,'#365D56',22);partyCardPanel(95,466,610,9,'#80AB87',4);const y=350-Math.abs(Math.sin(now*2))*65;partyCardPanel(355,y,75,85,'#E9C989',18);circ(379,y+28,5,'#203C4B',0);circ(407,y+28,5,'#203C4B',0);partyCardText('SALTA',400,130,40,'#203C4B','center',700,700);partyCardText('VISTA DEL MINIJUEGO · SIMULACIÓN LOCAL',400,550,14,'#C7DCD1');}
scene('draw');let lastPreviewFrame=0;function paint(){VW=800;OX=0;if(cv.width!==800)cv.width=800;now=performance.now()/1000;btns=[];
if(previewReceiver&&party.you.id==='a'&&now-lastPreviewFrame>.2){lastPreviewFrame=now;demoDraw();previewReceiver('frame',{image:cv.toDataURL('image/jpeg',.4),cmd:'JUMP!',time:4,duration:5},'b');}
game.draw(1);requestAnimationFrame(paint);}paint();
</script></html>
